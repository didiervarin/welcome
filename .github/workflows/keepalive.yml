name: Keep-alive

on:
  schedule:
    # Tourne tous les jours à 7h UTC pour garder le cron actif
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Keep-alive commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit --allow-empty -m "keep-alive $(date -u '+%Y-%m-%d')"
          git push origin main
