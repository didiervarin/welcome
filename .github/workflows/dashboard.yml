name: Dashboard Paris

on:
  schedule:
    # Toutes les 15 minutes (00, 15, 30, 45), entre 6h et 23h UTC (8h-1h heure Paris)
    - cron: '0,15,30,45 6-23 * * *'
  workflow_dispatch: # Lancement manuel depuis l'onglet Actions
  repository_dispatch:
    types: [manual-refresh]  # Déclenché par le bouton Refresh de la page

permissions:
  contents: write  # Nécessaire pour pousser sur gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le dashboard
        env:
          IDFM_API_KEY: ${{ secrets.IDFM_API_KEY }}   # Optionnel — clé IDF Mobilités
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_PASSWORD: ${{ secrets.ICLOUD_PASSWORD }}
        run: python generate.py

      - name: Sauvegarder le cache agenda
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add agenda_cache.json || true
          git diff --cached --quiet || git commit -m "cache agenda $(date -u '+%H:%M')"
          git push origin main || true

      - name: Déployer sur GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          commit-message: "Dashboard mis à jour"
